# Rendering settings for the Movement Ecology (BMC, Springer Nature) submission. Title, authors and
# affiliations are in title-block.tex; the abstract and keywords are written by paper.qmd, because
# sn-jnl needs them before \maketitle.
bibliography: references.bib
csl: vendor/biomed-central.csl
link-citations: true
format:
  pdf:
    documentclass: sn-jnl
    classoption: [pdflatex]
    pdf-engine: xelatex
    include-before-body: title-block.tex
    keep-tex: true
    number-sections: true
    fig-pos: "!t"
    tbl-cap-location: top
    colorlinks: true
  html:
    title: "How accurate is altitude from pressure geolocators?"
    subtitle: "A global assessment of three pressure-to-altitude conversions on the ground and in flight"
    toc: true
    number-sections: true
    embed-resources: true
    theme: cosmo
    title-block-banner: false
