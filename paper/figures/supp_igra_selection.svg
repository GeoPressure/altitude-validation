<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="1230" viewBox="0 0 1420 1230">
<rect width="1420" height="1230" fill="white"/>
<style>text{font-family:Arial,sans-serif;fill:#203041}</style>
<rect x="45" y="150" width="1330" height="830" rx="18" fill="#f7f9fb" stroke="#d4dde5" stroke-width="2"/>
<rect x="210.0" y="27.0" width="1000" height="76" rx="12" fill="#edf3f8" stroke="#8da0b1" stroke-width="2"/>
<text x="710" y="72" text-anchor="middle" font-size="23" font-weight="bold">1. Group candidate stations</text>
<rect x="410.0" y="178.0" width="600" height="84" rx="12" fill="#edf3f8" stroke="#8da0b1" stroke-width="2"/>
<text x="710" y="212" text-anchor="middle" font-size="23" font-weight="bold">2. Assess candidates within each cell</text>
<text x="710" y="242" text-anchor="middle" font-size="23" font-weight="bold">Candidate available?</text>
<polyline fill="none" stroke="#526273" stroke-width="2" points="710,103 710,178"/>
<polygon fill="#526273" points="710,178 715.0,166.0 705.0,166.0"/>
<rect x="1030.0" y="180.0" width="300" height="80" rx="12" fill="#ffffff" stroke="#8da0b1" stroke-width="2"/>
<text x="1180" y="212" text-anchor="middle" font-size="23" font-weight="normal">Leave cell</text>
<text x="1180" y="242" text-anchor="middle" font-size="23" font-weight="normal">unrepresented</text>
<polyline fill="none" stroke="#526273" stroke-width="2" points="1010,220 1030,220"/>
<polygon fill="#526273" points="1030,220 1018.0,215.0 1018.0,225.0"/>
<text x="1020" y="202" text-anchor="middle" font-size="20" font-weight="normal">No</text>
<rect x="400.0" y="337.0" width="620" height="76" rx="12" fill="#ffffff" stroke="#8da0b1" stroke-width="2"/>
<text x="710" y="382" text-anchor="middle" font-size="23" font-weight="normal">2a. Prepare sounding profiles</text>
<polyline fill="none" stroke="#526273" stroke-width="2" points="710,262 710,337"/>
<polygon fill="#526273" points="710,337 715.0,325.0 705.0,325.0"/>
<text x="745" y="306" text-anchor="middle" font-size="20" font-weight="normal">Yes</text>
<rect x="410.0" y="497.0" width="600" height="86" rx="12" fill="#edf3f8" stroke="#8da0b1" stroke-width="2"/>
<text x="710" y="532" text-anchor="middle" font-size="23" font-weight="normal">2b. Find a qualifying year</text>
<text x="710" y="562" text-anchor="middle" font-size="23" font-weight="normal">Coverage passes?</text>
<polyline fill="none" stroke="#526273" stroke-width="2" points="710,413 710,497"/>
<polygon fill="#526273" points="710,497 715.0,485.0 705.0,485.0"/>
<rect x="60.0" y="497.0" width="280" height="86" rx="12" fill="#edf3f8" stroke="#8da0b1" stroke-width="2"/>
<text x="200" y="532" text-anchor="middle" font-size="23" font-weight="normal">Earlier endpoint</text>
<text x="200" y="562" text-anchor="middle" font-size="23" font-weight="normal">available?</text>
<polyline fill="none" stroke="#526273" stroke-width="2" points="410,540 340,540"/>
<polygon fill="#526273" points="340,540 352.0,545.0 352.0,535.0"/>
<text x="375" y="521" text-anchor="middle" font-size="20" font-weight="normal">No</text>
<polyline fill="none" stroke="#526273" stroke-width="2" points="200,497 200,455 710,455 710,497"/>
<polygon fill="#526273" points="710,497 715.0,485.0 705.0,485.0"/>
<text x="450" y="438" text-anchor="middle" font-size="20" font-weight="normal">Yes: move back one day</text>
<polyline fill="none" stroke="#526273" stroke-width="2" points="200,583 200,650 30,650 30,220 410,220"/>
<polygon fill="#526273" points="410,220 398.0,215.0 398.0,225.0"/>
<text x="227" y="620" text-anchor="middle" font-size="20" font-weight="normal">No</text>
<text x="220" y="202" text-anchor="middle" font-size="21" font-weight="normal">Next candidate</text>
<rect x="410.0" y="692.0" width="600" height="76" rx="12" fill="#eaf4f2" stroke="#8da0b1" stroke-width="2"/>
<text x="710" y="737" text-anchor="middle" font-size="23" font-weight="bold">Accept station</text>
<polyline fill="none" stroke="#526273" stroke-width="2" points="710,583 710,692"/>
<polygon fill="#526273" points="710,692 715.0,680.0 705.0,680.0"/>
<text x="745" y="642" text-anchor="middle" font-size="20" font-weight="normal">Yes</text>
<rect x="500.0" y="882.0" width="420" height="76" rx="12" fill="#ffffff" stroke="#8da0b1" stroke-width="2"/>
<text x="710" y="927" text-anchor="middle" font-size="23" font-weight="normal">Finish cell</text>
<polyline fill="none" stroke="#526273" stroke-width="2" points="710,768 710,882"/>
<polygon fill="#526273" points="710,882 715.0,870.0 705.0,870.0"/>
<polyline fill="none" stroke="#526273" stroke-width="2" points="1180,260 1180,840 710,840"/>
<polygon fill="#526273" points="710,840 722.0,845.0 722.0,835.0"/>
<polyline fill="none" stroke="#526273" stroke-width="2" points="920,920 1390,920 1390,125 710,125 710,178"/>
<polygon fill="#526273" points="710,178 715.0,166.0 705.0,166.0"/>
<text x="1210" y="900" text-anchor="middle" font-size="20" font-weight="normal">More cells</text>
<rect x="210.0" y="1090.0" width="1000" height="80" rx="12" fill="#edf3f8" stroke="#8da0b1" stroke-width="2"/>
<text x="710" y="1137" text-anchor="middle" font-size="23" font-weight="bold">3. Summarize errors</text>
<polyline fill="none" stroke="#526273" stroke-width="2" points="710,958 710,1090"/>
<polygon fill="#526273" points="710,1090 715.0,1078.0 705.0,1078.0"/>
<text x="815" y="1040" text-anchor="middle" font-size="20" font-weight="normal">All cells assessed</text>
</svg>